<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06371f">
<title>Selfie Verification</title>
<style>
  :root {
    --primary: #0a633a;
    --primary-dark: #084d2d;
    --primary-deep: #06371f;
    --primary-soft: #e9f3ee;
    --saffron: #e9a521;
    --saffron-dark: #b97e0d;
    --bg: #f3f6f4;
    --text-main: #16231c;
    --text-muted: #47554e;
    --danger: #dc2626;
    --success: #059669;
    --border: #e2e8e4;
  }
  * { box-sizing: border-box; }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: radial-gradient(120% 80% at 50% 0%, #ffffff 0%, var(--bg) 55%, #e9f0eb 100%);
    color: var(--text-main);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }

  .capture-card {
    width: 100%; max-width: 360px; padding: 28px 22px;
    text-align: center;
  }

  .brand-row {
    display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 18px;
  }
  .brand-row svg { height: 26px; width: auto; }
  .brand-row span { font-size: 14px; font-weight: 800; letter-spacing: -0.3px; color: var(--primary-deep); }

  .capture-title { font-size: 18px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.3px; color: var(--text-main); }
  .capture-sub { font-size: 13px; color: var(--text-muted); margin: 0 0 22px; line-height: 1.5; }

  .camera-frame {
    position: relative; width: 100%; aspect-ratio: 1/1;
    background: var(--primary-deep); border-radius: 24px; overflow: hidden;
    margin-bottom: 18px; border: 1.5px solid var(--border);
    box-shadow: 0 18px 40px -20px rgba(6,55,31,0.5);
  }
  .camera-frame video, .camera-frame img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  /* Pulsing saffron focus ring while live */
  .cam-ring {
    position: absolute; inset: 18px; border: 2.5px dashed rgba(233,165,33,0.55);
    border-radius: 50%; pointer-events: none;
    animation: ringPulse 2s ease-in-out infinite;
  }
  /* Corner brackets for a "scanning" feel */
  .cam-corners::before, .cam-corners::after,
  .cam-corners > i::before, .cam-corners > i::after {
    content: ""; position: absolute; width: 26px; height: 26px;
    border: 3px solid rgba(255,255,255,0.85); pointer-events: none;
  }
  .cam-corners::before { top: 14px; left: 14px; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
  .cam-corners::after { top: 14px; right: 14px; border-left: none; border-bottom: none; border-radius: 0 8px 0 0; }
  .cam-corners > i::before { bottom: 14px; left: 14px; border-right: none; border-top: none; border-radius: 0 0 0 8px; }
  .cam-corners > i::after { bottom: 14px; right: 14px; border-left: none; border-top: none; border-radius: 0 0 8px 0; }

  @keyframes ringPulse {
    0% { transform: scale(0.94); opacity: 0.5; }
    50% { transform: scale(1.0); opacity: 1; }
    100% { transform: scale(0.94); opacity: 0.5; }
  }
  @media (prefers-reduced-motion: reduce) { .cam-ring { animation: none; } }

  .error-msg {
    color: var(--danger); font-size: 12.5px; font-weight: 600;
    margin: 0 0 16px; line-height: 1.5; display: none;
  }
  .status-msg {
    color: var(--text-muted); font-size: 12.5px; font-weight: 600;
    margin: 0 0 16px; display: none;
  }

  .btn-row { display: flex; gap: 10px; }
  button {
    flex: 1; padding: 13px; border: none; border-radius: 14px;
    font-size: 14.5px; font-weight: 700; cursor: pointer; font-family: inherit;
    transition: transform 0.1s ease, background 0.2s ease;
  }
  button:active { transform: scale(0.97); }
  .btn-secondary { background: #eef2ef; color: var(--text-main); }
  .btn-secondary:hover { background: #e3e9e4; }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 6px 16px rgba(10,99,58,0.25); }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-success { background: var(--success); color: #fff; box-shadow: 0 6px 16px rgba(5,150,105,0.25); }
  .btn-success:hover { background: #047857; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  .powered-by {
    margin-top: 18px; font-size: 11px; color: #90a096; font-weight: 600;
  }
  .success-check {
    width: 64px; height: 64px; border-radius: 50%; background: var(--primary-soft);
    color: var(--success); display: none; align-items: center; justify-content: center;
    margin: 0 auto 14px; border: 1px solid #b5e3d1;
    animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>

  <div class="capture-card">
    <div class="brand-row">

    <div class="success-check" id="success-check">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>

    <h1 class="capture-title" id="capture-title">Identity Verification</h1>
    <p class="capture-sub" id="capture-sub">Center your face in the frame and take a clear selfie.</p>

    <div class="camera-frame" id="camera-frame">
      <video id="camera-video" autoplay playsinline style="transform:scaleX(-1);"></video>
      <img id="camera-preview" style="display:none;" />
      <div class="cam-corners"><i></i></div>
      <div class="cam-ring" id="cam-ring"></div>
    </div>
    <canvas id="camera-canvas" style="display:none;"></canvas>

    <p class="error-msg" id="error-msg"></p>
    <p class="status-msg" id="status-msg">Requesting camera access…</p>

    <div class="btn-row" id="actions-live">
      <button class="btn-secondary" onclick="closeCapture()">Cancel</button>
      <button class="btn-primary" id="capture-btn" onclick="captureOrRetry()">📸 Capture</button>
    </div>
    <div class="btn-row" id="actions-preview" style="display:none;">
      <button class="btn-secondary" onclick="retake()">Retake</button>
      <button class="btn-success" onclick="confirmAndSend()">Use This Photo</button>
    </div>

    <div class="powered-by">Secure capture • Closes automatically when done</div>

    <div class="btn-row" id="actions-done" style="display:none; margin-top: 18px;">
      <button class="btn-primary" onclick="manualClose()">Continue</button>
    </div>
  </div>

<script>
  let stream = null;
  let capturedBase64 = null;

  // Read optional title/subtitle from URL params so the Apps Script side can customize the message
  const params = new URLSearchParams(window.location.search);
  const requestId = params.get('requestId') || '';
  const ua = navigator.userAgent || '';
  const isIOSWebKit = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (params.get('title')) document.getElementById('capture-title').innerText = params.get('title');
  if (params.get('sub')) document.getElementById('capture-sub').innerText = params.get('sub');

  function setStatus(msg) {
    const el = document.getElementById('status-msg');
    el.innerText = msg;
    el.style.display = msg ? 'block' : 'none';
  }
  function setError(msg) {
    const el = document.getElementById('error-msg');
    el.innerText = msg;
    el.style.display = msg ? 'block' : 'none';
  }

  function startCamera() {
    setError('');
    setStatus('Requesting camera access…');
    document.getElementById('camera-video').style.display = 'block';
    document.getElementById('camera-preview').style.display = 'none';
    document.getElementById('actions-live').style.display = 'flex';
    document.getElementById('actions-preview').style.display = 'none';
    document.getElementById('cam-ring').style.display = 'block';

    if (!window.isSecureContext) {
      setStatus('');
      setError('Camera requires a secure (HTTPS) connection.');
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('');
      setError('Camera is not supported in this browser. Try Chrome or Safari.');
      return;
    }

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
      .then(s => {
        stream = s;
        const video = document.getElementById('camera-video');
        video.srcObject = s;
        const playVideo = () => video.play().catch(() => setStatus('Camera is ready. Tap Capture when your face is visible.'));
        if (video.readyState >= 1) playVideo();
        else video.onloadedmetadata = playVideo;
        setStatus('');
        document.getElementById('capture-btn').innerHTML = '📸 Capture';
      })
      .catch(err => {
        setStatus('');
        let msg = 'Camera access failed. ';
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          msg += 'Permission was denied. Tap the 🔒 icon next to the address bar, allow Camera access, then retry.';
        } else if (err.name === 'NotFoundError') {
          msg += 'No camera was found on this device.';
        } else if (err.name === 'NotReadableError') {
          msg += 'Camera is already in use by another app.';
        } else {
          msg += (err.message || err.name || 'Unknown error');
        }
        setError(msg);
        document.getElementById('capture-btn').innerHTML = '🔄 Retry Camera';
      });
  }

  function captureOrRetry() {
    if (stream) {
      takePhoto();
    } else {
      startCamera();
    }
  }

  function takePhoto() {
    const video = document.getElementById('camera-video');
    if (!stream || video.readyState < 2 || !video.videoWidth) {
      setError('Camera is still starting. Please wait a moment, then tap Capture again.');
      return;
    }
    const canvas = document.getElementById('camera-canvas');
    canvas.width = video.videoWidth || 480;
    canvas.height = video.videoHeight || 480;
    const ctx = canvas.getContext('2d');
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    capturedBase64 = canvas.toDataURL('image/jpeg', 0.85);

    document.getElementById('camera-preview').src = capturedBase64;
    document.getElementById('camera-video').style.display = 'none';
    document.getElementById('camera-preview').style.display = 'block';
    document.getElementById('cam-ring').style.display = 'none';
    document.getElementById('actions-live').style.display = 'none';
    document.getElementById('actions-preview').style.display = 'flex';
  }

  function retake() {
    capturedBase64 = null;
    document.getElementById('camera-video').style.display = 'block';
    document.getElementById('camera-preview').style.display = 'none';
    document.getElementById('cam-ring').style.display = 'block';
    document.getElementById('actions-live').style.display = 'flex';
    document.getElementById('actions-preview').style.display = 'none';
  }

  function stopCamera() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  }

  // Return the captured photo to the opener (the app running in the Apps Script
  // iframe) via postMessage. NOTE: localStorage / BroadcastChannel do NOT work
  // as fallbacks here — this page (attendance.gdl.bt) and the app iframe
  // (script.google.com) are different origins and don't share either. The Apps
  // Script side listens for postMessage only, so that's the one real channel.
  function confirmAndSend() {
    stopCamera();

    if (window.opener) {
      try { window.opener.postMessage({ type: 'SELFIE_CAPTURED', requestId, image: capturedBase64 }, '*'); } catch(e) {}
    }

    // Success UI
    document.getElementById('camera-frame').style.display = 'none';
    document.getElementById('success-check').style.display = 'flex';
    document.getElementById('capture-title').innerText = 'Verification Complete';
    document.getElementById('capture-sub').innerText = 'You can close this window and return to the app.';
    setStatus('');
    setError('');
    document.getElementById('actions-live').style.display = 'none';
    document.getElementById('actions-preview').style.display = 'none';

    // Show the manual Continue button right away rather than waiting on a
    // timer — timers can be throttled/suspended once window.close() is
    // attempted, which was preventing the button from ever appearing.
    document.getElementById('actions-done').style.display = 'flex';

    setTimeout(() => {
      try { window.close(); } catch(e) {}
    }, 800);
  }

  // Fallback for when window.close() is blocked by the browser (e.g. tab wasn't
  // opened purely by script). The result was already sent via postMessage above,
  // so this just retries closing and, if that still fails, tells the user it's
  // safe to close manually.
  function manualClose() {
    try { window.close(); } catch(e) {}
    setStatus('You can now close this window.');
    document.getElementById('actions-done').style.display = 'none';
  }

  function closeCapture() {
    stopCamera();
    if (window.opener) {
      try { window.opener.postMessage({ type: 'SELFIE_CANCELLED', requestId }, '*'); } catch(e) {}
    }
    try { window.close(); } catch(e) {}
  }

  // If the user closes the tab manually without confirming, release the camera
  window.addEventListener('beforeunload', stopCamera);

  function waitForCameraTap() {
    setError('');
    setStatus('Tap Start Camera to allow camera access.');
    document.getElementById('camera-video').style.display = 'none';
    document.getElementById('camera-preview').style.display = 'none';
    document.getElementById('cam-ring').style.display = 'none';
    document.getElementById('actions-live').style.display = 'flex';
    document.getElementById('actions-preview').style.display = 'none';
    document.getElementById('capture-btn').innerHTML = 'Start Camera';
  }

  if (isIOSWebKit) waitForCameraTap();
  else startCamera();
</script>
</body>
</html>
