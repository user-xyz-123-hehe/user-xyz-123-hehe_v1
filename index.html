<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- PWA install metadata -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Attendance">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a633a">

  <link rel="manifest" href="./manifest.json">

  <!-- Icons — iOS requires its own apple-touch-icon link, ignores manifest.json -->
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">

  <title>GDL Attendance</title>
  <style>
    :root {
      --primary: #0a633a;
      --primary-dark: #084d2d;
      --primary-deep: #06371f;
      --primary-soft: #e9f3ee;
      --saffron: #e9a521;
      --saffron-dark: #b97e0d;
      --bg: #f3f6f4;
      --text-main: #16231c;
      --text-muted: #47554e;
      --danger: #dc2626;
    }
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: var(--bg); font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; }

    .wrapper { position: absolute; left: 0; width: 100vw; top: -55px; height: calc(100vh + 55px); background-color: var(--bg); }
    @media (min-width: 600px) { .wrapper { top: -45px; height: calc(100vh + 45px); } }
    @media (min-width: 1024px) { .wrapper { top: -36px; height: calc(100vh + 36px); } }

    iframe { width: 100%; height: 100%; border: none; background-color: transparent; }

    /* ───── Offline fallback ───── */
    #offline-fallback {
      display: none; height: 100vh; width: 100vw; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; color: var(--text-main);
      background: var(--bg); position: fixed; top: 0; left: 0; z-index: 99998; padding: 0 32px; box-sizing: border-box;
    }
    #offline-fallback h2 { font-size: 18px; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.3px; }
    #offline-fallback p { margin: 0; color: var(--text-muted); font-size: 13.5px; max-width: 260px; line-height: 1.5; }
    #offline-fallback button {
      margin-top: 20px; padding: 11px 22px; background: var(--primary); color: #fff; border: none;
      border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
      box-shadow: 0 6px 16px rgba(10,99,58,0.25);
    }

    /* ───── Splash / loading screen ───── */
    #splash-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(120% 90% at 50% 25%, #ffffff 0%, var(--bg) 60%, #e9f0eb 100%);
      z-index: 99999; display: flex; flex-direction: column;
      align-items: center; justify-content: center; transition: opacity 0.45s ease;
    }

    /* Emblem + concentric pulse rings */
    .splash-logo-wrap {
      position: relative;
      width: 132px; height: 132px;
      margin-bottom: 30px;
      display: flex; align-items: center; justify-content: center;
    }
    .splash-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid rgba(10,99,58,0.16);
      animation: ringPulse 2.4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .splash-ring.r2 { animation-delay: 0.8s; }
    .splash-ring.r3 { animation-delay: 1.6s; }
    .splash-logo {
      width: 84px; height: auto; display: block;
      animation: logoBreathe 2.6s ease-in-out infinite;
      filter: drop-shadow(0 8px 18px rgba(6,55,31,0.18));
    }

    .splash-title {
      font-size: 21px; font-weight: 800; letter-spacing: -0.6px;
      color: var(--primary-deep); margin: 0 0 6px;
    }
    .splash-title .accent { color: var(--saffron-dark); }

    .splash-status {
      display: flex; align-items: center; gap: 9px;
      color: var(--text-muted); font-weight: 600; font-size: 12.5px; letter-spacing: 0.3px;
      margin-top: 14px;
    }
    .splash-spinner {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid rgba(10,99,58,0.18); border-top-color: var(--primary);
      animation: spin 0.8s linear infinite;
    }
    /* Saffron progress sliver under the status */
    .splash-progress {
      margin-top: 22px; width: 128px; height: 3px; border-radius: 3px;
      background: rgba(10,99,58,0.10); overflow: hidden;
    }
    .splash-progress::before {
      content: ""; display: block; height: 100%; width: 40%;
      background: linear-gradient(90deg, var(--saffron), var(--saffron-dark));
      border-radius: 3px; animation: slide 1.4s ease-in-out infinite;
    }

    @keyframes logoBreathe {
      0% { transform: scale(0.94); opacity: 0.9; }
      50% { transform: scale(1.0); opacity: 1; }
      100% { transform: scale(0.94); opacity: 0.9; }
    }
    @keyframes ringPulse {
      0% { transform: scale(0.55); opacity: 0; }
      35% { opacity: 0.9; }
      100% { transform: scale(1.25); opacity: 0; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(360%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-ring, .splash-logo, .splash-progress::before { animation: none !important; }
      .splash-spinner { animation-duration: 0.8s; }
    }

    /* ───── Install button ───── */
    #install-btn {
      display: none;
      position: fixed; top: 16px; right: 16px;
      background-color: var(--primary); color: #ffffff; border: none; padding: 9px 18px;
      border-radius: 11px; font-size: 13.5px; font-weight: 700; letter-spacing: 0.1px;
      box-shadow: 0 6px 16px rgba(10,99,58,0.28); cursor: pointer; z-index: 10000;
      transition: background-color 0.2s ease, transform 0.1s ease; font-family: inherit;
    }
    #install-btn:hover { background-color: var(--primary-dark); }
    #install-btn:active { transform: scale(0.96); }

    #wrapper-version-badge {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 100001;
      padding: 6px 10px;
      border-radius: 999px;
      background: #e9a521;
      color: #06371f;
      border: 1px solid rgba(6,55,31,0.24);
      box-shadow: 0 4px 14px rgba(6,55,31,0.18);
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
    }
</style>
</head>
<body>

      <span class="splash-spinner"></span>
      <span id="splash-status-text">Connecting securely…</span>

  <div id="offline-fallback">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 16px;"><path d="m2 2 20 20"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.82"/></svg>
    <h2>No Connection</h2>
    <p>You must be connected to the internet to launch the attendance portal.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>

  <button id="install-btn">⬇ Install App</button>

  <div class="wrapper" id="app-wrapper">
    <iframe id="attendance-frame" src="https://script.google.com/macros/s/AKfycbxuTCJUJUTHnSiogMYOojF4wMAU5Pk1rZsXhHe6iaNbVYMHy9YysV3Wg4zPMJ4Ph04/exec?v=10" allow="geolocation; camera; microphone" allowfullscreen title="GDL Attendance"></iframe>
  </div>

<script>
    const WRAPPER_VERSION = 'V10';
    window.WRAPPER_VERSION = WRAPPER_VERSION;

    // ───── Splash Screen Fader ─────
    let splashHidden = false;
    function hideSplash() {
      if (splashHidden) return;
      splashHidden = true;
      const splash = document.getElementById('splash-screen');
      splash.style.opacity = '0';
      setTimeout(() => splash.style.display = 'none', 450);
    }

    // Update splash status text while waiting (purely cosmetic, reassures the user something is happening)
    const statusMessages = ['Connecting securely…', 'Loading your dashboard…', 'Almost there…'];
    let statusIdx = 0;
    const statusInterval = setInterval(() => {
      if (splashHidden) { clearInterval(statusInterval); return; }
      statusIdx = (statusIdx + 1) % statusMessages.length;
      const el = document.getElementById('splash-status-text');
      if (el) el.textContent = statusMessages[statusIdx];
    }, 2200);

    window.addEventListener('message', (event) => {
      if (event.data === 'hideSplash') hideSplash();
    });

    // Safety net: never let the splash hang forever even if the iframe fails to post back
    setTimeout(hideSplash, 6000);

    if (!navigator.onLine) {
      document.getElementById('app-wrapper').style.display = 'none';
      document.getElementById('splash-screen').style.display = 'none';
      document.getElementById('offline-fallback').style.display = 'flex';
    }

    window.addEventListener('online', () => {
      if (document.getElementById('offline-fallback').style.display === 'flex') {
        window.location.reload();
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=10')
          .then(reg => reg.update())
          .catch(err => console.warn('SW registration failed:', err));
      });
    }

    // ───── PWA Install Logic ─────
    let deferredPrompt = null;
    const installBtn = document.getElementById('install-btn');

    function isStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }

    // Only show the install button if not already installed
    if (!isStandalone()) {
      installBtn.style.display = 'block';
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!isStandalone()) installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        installBtn.style.display = 'none';
      } else {
        const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
        const msg = isIOS
          ? "To install this app on your iPhone:\n\n1. Tap the Share button (□↑) at the bottom of Safari\n2. Scroll down and tap 'Add to Home Screen'\n3. Tap 'Add' in the top right"
          : "To install this app:\n\n1. Tap the three-dot menu (⋮) in the top right of Chrome\n2. Select 'Install app' or 'Add to Home screen'\n3. Confirm to add it to your device";
        alert(msg);
      }
    });

    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
      deferredPrompt = null;
    });
  </script>
</body>
</html>
